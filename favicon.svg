<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Fundo do Ícone (Bordas Arredondadas) -->
  <rect width="64" height="64" rx="16" fill="#0F172A" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#emeraldGrad)" stroke-width="2.5" opacity="0.6" />
  
  <!-- Cifrão Estilizado Premium -->
  <g filter="url(#shadow)">
    <!-- Linha Vertical -->
    <line x1="32" y1="12" x2="32" y2="52" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
    
    <!-- S do Cifrão -->
    <path d="M42 22 C42 16 22 16 22 27 C22 38 42 34 42 43 C42 52 22 51 22 45" 
          fill="none" 
          stroke="url(#emeraldGrad)" 
          stroke-width="5.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
